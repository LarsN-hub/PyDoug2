[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pydoug-napari"
version = "0.1.0"
description = "napari plugin for PyDoug"
requires-python = ">=3.13"
license = "MIT"
authors = [
    {name = "Douglas Lars Nelson", email = "PyDoug@referable.anonaddy.com"}
]
keywords = [
    "image processing",
    "image segmentation",
    "microscopy",
    "tomography",
    "scientific imaging"
]
dependencies = [
    "pydoug-core",
    "magic-class==0.7.23",
    "magicgui==0.10.2",
    "PySide6==6.11.2",
    "napari==0.9.2",
    "qtpy==2.4.3",
]

[project.optional-dependencies]
testing = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-qt==4.5.0",
    "napari[testing]",
]

[project.entry-points."napari.manifest"]
pydoug-napari = "pydoug_napari:napari.yaml"

[tool.hatch.build.targets.wheel]
packages = ["src/pydoug_napari"]

[tool.hatch.build.targets.wheel.force-include]
"src/pydoug_napari/napari.yaml" = "pydoug_napari/napari.yaml"
