[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pydoug-napari"
version = "0.1.0"
description = "napari plugin for PyDoug"
requires-python = ">=3.11"
license = "MIT"
authors = [
    {name = "Douglas Lars Nelson", email = "PyDoug@referable.anonaddy.com"}
]
keywords = [
    "image processing",
    "image segmentation",
    "microscopy",
    "tomography",
    "scientific imaging"
]
dependencies = [
    "pydoug-core",
    "magic-class",
    "magicgui",
    "PySide6",
    "napari",
    "qtpy",
]

[project.optional-dependencies]
testing = [
    "pytest",
    "pytest-cov",
    "pytest-qt",
    "napari[testing]",
]

[project.entry-points."napari.manifest"]
pydoug-napari = "pydoug_napari:napari.yaml"

[tool.hatch.build.targets.wheel]
packages = ["src/pydoug_napari"]

[tool.hatch.build.targets.wheel.force-include]
"src/pydoug_napari/napari.yaml" = "pydoug_napari/napari.yaml"
