[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pydoug-standalone"
version = "0.1.0"
description = "Standalone launcher for PyDoug app (PyInstaller entry point)"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "pydoug-core",
    "pydoug-napari",
    "pyinstaller==6.22.2",
    "third-party-license-file-generator==2025.12.31.post2"
]

[tool.hatch.build.targets.wheel]
packages = ["src/pydoug_standalone"]
