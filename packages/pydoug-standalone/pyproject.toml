[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pydoug-standalone"
version = "0.1.1"
description = "Standalone launcher for PyDoug app (PyInstaller entry point)"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [
    {name = "Douglas Lars Nelson", email = "PyDoug@referable.anonaddy.com"}
]
keywords = [
    "image processing",
    "image segmentation",
    "microscopy",
    "tomography",
    "scientific imaging"
]
dependencies = [
    "pydoug-core~=0.1.0",
    "pydoug-napari~=0.1.0",
    "pyinstaller==6.22.2",
    "third-party-license-file-generator==2025.12.31.post2"
]

[tool.hatch.build.targets.wheel]
packages = ["src/pydoug_standalone"]
