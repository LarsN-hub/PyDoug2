[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pydoug-core"
version = "0.1.1"
description = "Core I/O, image processing and analysis, and batch logic for PyDoug"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [
    {name = "Douglas Lars Nelson", email = "PyDoug@referable.anonaddy.com"}
]
keywords = [
    "image processing",
    "image segmentation",
    "microscopy",
    "tomography",
    "scientific imaging",
]
dependencies = [
    "algotom==1.7.0",
    "cmasher==1.9.2",
    "h5py==3.16.0",
    "ImageIO==2.37.4",
    "matplotlib==3.11.1",
    "numba==0.67.0",
    "numpy==2.5.2",
    "openpnm==3.6.4",
    "porespy==3.1.0",
    "psygnal==0.15.1",
    "scikit-image==0.26.0",
    "scipy==1.18.0",
]

[project.optional-dependencies]
testing = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
]

[project.urls]
Homepage = "https://github.com/LarsN-hub/PyDoug2"
Issues = "https://github.com/LarsN-hub/PyDoug2/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/pydoug_core"]
