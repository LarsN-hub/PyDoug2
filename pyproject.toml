[tool.ruff]
line-length = 88
src = [
    "packages/pydoug-core/src",
    "packages/pydoug-napari/src",
    "packages/pydoug-standalone/src"
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP"
]

[tool.pytest.ini_options]
testpaths = [
    "packages/pydoug-core/tests",
    "packages/pydoug-napari/tests",
    "packages/pydoug-standalone/tests",
]
filterwarnings = [
    "ignore:.*json_encoders.*is deprecated.*:DeprecationWarning:pydantic._internal._generate_schema",
    "ignore:.*writing zero-size array to nonconformant TIFF.*:UserWarning:tifffile.tifffile",
]

[tool.coverage.run]
source = [
    "packages/pydoug-core",
    "packages/pydoug-napari",
    "packages/pydoug-standalone",
]
